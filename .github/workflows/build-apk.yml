name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 發佈 GitHub Release 需要寫入權限(App 的自我更新從 Release 下載新版 APK)。
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConnectIt-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConnectIt-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 只有 master 而且有固定簽章金鑰時才發佈 Release:App 內的自我更新(update/AppUpdater.kt)會下載
      # 這個 APK 覆蓋安裝,簽章跟已安裝的版本不同的話系統會拒絕更新。tag 最後一段 = versionCode。
      - name: Prepare release APK
        if: github.ref == 'refs/heads/master' && env.RELEASE_KEYSTORE_PATH != ''
        run: cp app/build/outputs/apk/release/*.apk ConnectIt.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' && env.RELEASE_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ConnectIt 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: ConnectIt.apk
          make_latest: true
